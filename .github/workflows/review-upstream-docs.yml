name: Weekly Upstream Docs Review

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Open a triage issue and save the checkpoint'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-docs-review
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 scripts/review-upstream-docs.py
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    if: github.event.repository.fork == false && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || inputs.publish)
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 scripts/review-upstream-docs.py --publish
        env:
          GH_TOKEN: ${{ github.token }}
