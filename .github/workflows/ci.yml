name: CI

# Guards the toolchain, not the app build — Vercel already builds every push
# and PR. This catches the class of breakage that took the daily sync down for
# three days after the Yarn Berry migration: a package manager / Node / lockfile
# mismatch that only ever surfaced at 06:00 UTC.

on:
  push:
    branches: [main]
    paths-ignore:
      # The daily sync bot commits docs to main every morning; don't burn a run on it.
      - 'docs/**'
      - '.agents/**'
      - 'archives/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - 'archives/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PRs from forks run untrusted code: read-only token, and no secrets are used.
permissions:
  contents: read

jobs:
  install-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Must run BEFORE setup-node: `cache: 'yarn'` shells out to `yarn cache dir`,
      # and the runner's global Yarn 1 refuses to run at all once package.json
      # declares "packageManager": "yarn@4.x". Corepack replaces that shim.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Keep in step with the sync workflows: @supabase/supabase-js needs a
          # native WebSocket, which Node 20 lacks.
          node-version: '22'
          cache: 'yarn'

      # --immutable fails if the lockfile is out of sync with package.json,
      # which is the check that matters most here.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      # Offline: a scripted answer runs through the real web route and Discord
      # handler, so source footers can't silently break (GitHub #169). No API
      # keys, no network. Real model quality is `yarn test:live`, run by hand.
      - name: Presentation regression tests
        run: yarn test

      # The Discord bot is excluded from the root typecheck and Vercel never
      # builds it, so without these a bot-only break surfaced at VPS deploy.
      # It imports src/lib, which is why it runs after the root install.
      - name: Install Discord bot dependencies
        working-directory: bot
        run: npm ci --no-audit --no-fund

      - name: Typecheck Discord bot
        working-directory: bot
        run: npm run typecheck

      - name: Build Discord bot
        working-directory: bot
        run: npm run build
