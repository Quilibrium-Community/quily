name: CI Yarn Smoke (temporary)

# TEMPORARY: verifies the corepack/Yarn Berry fix on a branch before merging.
# workflow_dispatch only works from the default branch, so this uses push.
on:
  push:
    branches:
      - 'ci-test/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Diagnostics
        run: |
          echo "which yarn: $(which yarn)"
          echo "yarn version: $(yarn --version)"
          echo "cacheFolder: $(yarn config get cacheFolder)"
          echo "enableGlobalCache: $(yarn config get enableGlobalCache)"
          echo "globalFolder: $(yarn config get globalFolder)"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Exercise a sync script (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn sync-docs status
